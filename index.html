<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff0000">
  <meta name="description" content="Acceso instalable a YouTube">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <title>YouTube</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#fff}
    .box{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
    .logo{width:110px}
    .btn{background:#ff0000;color:white;border:0;border-radius:8px;padding:14px 24px;font-size:18px;font-weight:bold}
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="./icon-192.png" alt="YouTube">
    <button class="btn" onclick="abrirYouTube()">Abrir YouTube</button>
  </div>

  <script>
    function abrirYouTube(){
      window.location.href = "https://m.youtube.com/";
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
    }

    // YouTube no permite ser mostrado dentro de un iframe.
    // Al abrir la aplicación, enviamos directamente al sitio oficial.
    setTimeout(abrirYouTube, 500);
  </script>
</body>
</html>
